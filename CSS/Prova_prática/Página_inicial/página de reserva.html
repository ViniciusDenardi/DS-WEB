    <h1 align="center"> <strong> Faça sua reserva aqui </strong></h1>
    <div class=" formulario"> 
     <form action="processa.php" method="post">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" maxlength="50" required placeholder=" Digite seu nome"> 
    <br>
    <hr>
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required placeholder="Digite seu email">
    <br>
    <hr>
    <label for="telefone">Telefone:</label >
    <input type="tel" id="Telefone" name="Telefone" maxlength="11" placeholder="Dgite seu telefone">
    <br>
    <hr>
    <label for="Quantidade de pessoas">Quantidade de pessoas:</label>
    <input type="number" id="Quantidade" name="Quantidade de pessoas" required placeholder="Digite a quantidade de pessoas"  min="0" max="10">
    <br>
    <hr>
    <label for="opiniao">comentário:</label>
    <br>
    <textarea id="opiniao" name="opiniao" rows="6" cols="50" max-length="300" required>
        Digite seu comentário aqui, informando o horário da reserva e o dia. Se estiver com alguma dúvida, também pode digitar nesse espaço
    </textarea>
    <br>
    <div ><input  class="botao" type="submit" value="Enviar"> </div>
    </form>
    </div>
